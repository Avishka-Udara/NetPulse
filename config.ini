; Defaults for first launch. Personal settings are stored in %LOCALAPPDATA%\NetPulse.
[plan]
peak_start=08:00
peak_end=00:00
peak_gb=100
offpeak_gb=100
reset_day=1
reset_time=00:00
[widget]
; 0=left, 1=center, 2=right
position=2
; Additional horizontal offset, in logical pixels
offset=0
; Width and text size in logical pixels; width expands to fit larger text
width=136
font_size=11
; Theme: 0=Windows, 1=light, 2=dark
theme=0
transparent=1
show_totals=1
[network]
; 0 selects physical interfaces with a default route; otherwise an interface LUID
adapter=0
